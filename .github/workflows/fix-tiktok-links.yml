name: Fix TikTok offer links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tiktok-links.yml'

permissions:
  contents: write

jobs:
  patch-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace blocked Adjust links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(
              r'href="https://ddnf\.adj\.st/webview/\?[^\"]+"\s+target="_blank"\s+rel="nofollow sponsored noopener"',
              'href="go.html" rel="nofollow sponsored"',
              html,
          )
          html = html.replace('src="script.js" defer', 'src="script.js?v=2" defer')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit corrected links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use TikTok-compatible offer route"
          git push
